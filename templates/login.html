{% extends "base.html" %}
{% block title %}Login · Expense Tracker{% endblock %}
{% block content %}
<section class="auth-wrap">
  <h1 class="auth-title">Expense Tracker</h1>
  <p class="auth-sub">Track daily spending simply.</p>

  <form method="post" class="auth-form" novalidate>
    <div class="mb-3">
      <label for="mobile_no" class="form-label">Mobile Number</label>
      <input type="tel" class="form-control form-control-lg" id="mobile_no" name="mobile_no"
             inputmode="numeric" pattern="[0-9]*" placeholder="10-digit mobile" required autofocus>
    </div>
    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control form-control-lg" id="password" name="password"
             placeholder="Your password" required>
    </div>
    <button type="submit" class="btn btn-dark btn-lg w-100">Log In</button>
  </form>

  <p class="text-center mt-4 mb-0 auth-switch">
    New here? <a href="{{ url_for('register') }}">Create account</a>
  </p>
</section>
{% endblock %}
